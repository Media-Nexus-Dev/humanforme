<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMAN FORME — Private Longevity Clinic</title>
  <meta name="description" content="Advanced diagnostics, preventative medicine, and precision optimization — engineered to build the highest form of yourself.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #050505;
      --brass:      #B58A3A;
      --brass-soft: #C9A45C;
      --muted:      #9A9A9A;
      --off-white:  #F5F2EA;
    }

    html, body { height: 100%; }

    body {
      background-color: var(--bg);
      font-family: 'Raleway', sans-serif;
      overflow-x: hidden;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .content {
      width: 100%;
      max-width: 700px;
      opacity: 0;
      animation: fadeUp 2s cubic-bezier(0.22, 1, 0.36, 1) 0.8s forwards;
    }

    .wordmark {
      font-weight: 300;
      font-size: clamp(28px, 7.5vw, 68px);
      letter-spacing: 0.3em;
      word-spacing: 0.48em;
      color: var(--brass-soft);
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 30px;
    }

    .divider {
      width: 36px;
      height: 1px;
      background-color: var(--brass);
      margin: 0 auto 22px;
    }

    .tagline {
      font-weight: 300;
      font-size: clamp(10px, 1.6vw, 12px);
      letter-spacing: 0.52em;
      color: var(--brass-soft);
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .phrase {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(16px, 2.6vw, 21px);
      line-height: 1.95;
      color: var(--muted);
      max-width: 520px;
      margin: 8px auto 64px;
    }

    .form-section { margin-bottom: 60px; }

    .form-label {
      display: block;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.48em;
      color: var(--brass);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 340px;
      margin: 0 auto 28px;
    }

    .form-fields input {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      border-bottom: 1px solid #242424;
      padding: 12px 0;
      width: 100%;
      color: var(--off-white);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-align: center;
      outline: none;
      border-radius: 0;
      transition: border-color 0.3s;
    }

    .form-fields input::placeholder { color: #333; letter-spacing: 0.14em; }
    .form-fields input:focus { border-bottom-color: var(--brass); }

    .form-btn {
      appearance: none;
      -webkit-appearance: none;
      display: inline-block;
      padding: 14px 48px;
      background: transparent;
      border: 1px solid var(--brass);
      color: var(--brass-soft);
      font-family: 'Raleway', sans-serif;
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.44em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 0;
      transition: background-color 0.28s, color 0.28s;
    }

    .form-btn:hover  { background-color: var(--brass); color: var(--bg); }
    .form-btn:active { opacity: 0.85; }

    .success-msg {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 17px;
      letter-spacing: 0.08em;
      color: var(--brass-soft);
      padding: 12px 0 4px;
    }

    .footer-tick {
      width: 1px;
      height: 24px;
      background-color: #1d1d1d;
      margin: 0 auto 18px;
    }

    .coming-soon {
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.38em;
      color: #363636;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .page    { padding: 60px 24px; }
      .tagline { letter-spacing: 0.36em; }
      .form-btn { padding: 13px 36px; letter-spacing: 0.36em; }
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>

  <div class="page">
    <div class="content">

      <h1 class="wordmark">HUMAN&nbsp;FORME</h1>

      <div class="divider"></div>
      <p class="tagline">Forme Your Future</p>
      <div class="divider"></div>

      <p class="phrase">Advanced diagnostics, preventative medicine, and precision&nbsp;optimization&nbsp;&mdash; engineered to build the highest form of&nbsp;yourself.</p>

      <div class="form-section">
        <span class="form-label">Request Early Access</span>
        <form class="form-fields" id="accessForm" novalidate>
          <input type="text"  name="name"  placeholder="Name"  autocomplete="name">
          <input type="email" name="email" placeholder="Email" autocomplete="email">
          <input type="tel"   name="phone" placeholder="Phone" autocomplete="tel">
          <button type="submit" class="form-btn">Notify Me</button>
        </form>
        <p class="success-msg" id="successMsg">Thank you. We will be in touch.</p>
      </div>

      <div class="footer-tick"></div>
      <p class="coming-soon">Private Longevity Clinic&nbsp;&mdash;&nbsp;Coming Soon</p>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    /* ═══════════════════════════════════════════════════
       HUMAN CONSTELLATION — Brass Node Network
       Anatomical landmarks → glowing nodes + edges
       Traveling signal pulses along nerve pathways
    ═══════════════════════════════════════════════════ */

    const canvas   = document.getElementById('bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(1.5, 0.5, 22);
    camera.lookAt(0, 0, 0);

    /* ── Soft ambient only — glow comes from sprites ── */
    scene.add(new THREE.AmbientLight(0xffffff, 0.06));

    /* ── Radial glow texture ── */
    function makeGlowTex() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0,    'rgba(252, 230, 155, 1.00)');
      g.addColorStop(0.10, 'rgba(230, 185,  90, 0.95)');
      g.addColorStop(0.30, 'rgba(181, 138,  58, 0.55)');
      g.addColorStop(0.60, 'rgba(150, 105,  30, 0.18)');
      g.addColorStop(1.00, 'rgba( 80,  55,  10, 0.00)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }
    const GLOW_TEX = makeGlowTex();

    /* ════════════════════════════════════════
       ANATOMICAL NODE MAP
       [ [x, y, z],  glowRadius ]
       Body centred at origin, ~14 units tall
    ════════════════════════════════════════ */
    const NODES = [
      /* 00 */ [[  0.00,  6.50,  0.00], 0.90],  // crown
      /* 01 */ [[ -0.50,  6.15,  0.42], 0.70],  // left temple
      /* 02 */ [[  0.50,  6.15,  0.42], 0.70],  // right temple
      /* 03 */ [[  0.00,  5.80,  0.65], 0.65],  // brow centre
      /* 04 */ [[ -0.42,  5.40,  0.60], 0.60],  // left cheek
      /* 05 */ [[  0.42,  5.40,  0.60], 0.60],  // right cheek
      /* 06 */ [[  0.00,  4.90,  0.42], 0.60],  // chin

      /* 07 */ [[  0.00,  4.30,  0.00], 0.80],  // neck base
      /* 08 */ [[  0.00,  3.10,  0.00], 0.78],  // upper thoracic
      /* 09 */ [[  0.00,  1.60,  0.00], 0.72],  // mid spine
      /* 10 */ [[  0.00,  0.10,  0.00], 0.72],  // lumbar
      /* 11 */ [[  0.00, -1.20,  0.00], 0.78],  // sacrum

      /* 12 */ [[ -2.20,  3.80,  0.00], 0.82],  // left shoulder
      /* 13 */ [[  2.20,  3.80,  0.00], 0.82],  // right shoulder
      /* 14 */ [[ -3.10,  2.20,  0.00], 0.72],  // left elbow
      /* 15 */ [[  3.10,  2.20,  0.00], 0.72],  // right elbow
      /* 16 */ [[ -3.70,  0.55,  0.00], 0.65],  // left wrist
      /* 17 */ [[  3.70,  0.55,  0.00], 0.65],  // right wrist
      /* 18 */ [[ -4.00, -0.20,  0.00], 0.55],  // left hand
      /* 19 */ [[  4.00, -0.20,  0.00], 0.55],  // right hand

      /* 20 */ [[ -1.10,  3.20,  0.52], 0.72],  // left chest
      /* 21 */ [[  1.10,  3.20,  0.52], 0.72],  // right chest
      /* 22 */ [[  0.00,  2.30,  0.52], 0.68],  // sternum
      /* 23 */ [[ -0.85,  1.20,  0.42], 0.64],  // left upper abdomen
      /* 24 */ [[  0.85,  1.20,  0.42], 0.64],  // right upper abdomen
      /* 25 */ [[  0.00,  0.00,  0.40], 0.60],  // navel

      /* 26 */ [[ -1.25, -1.80,  0.00], 0.78],  // left hip
      /* 27 */ [[  1.25, -1.80,  0.00], 0.78],  // right hip
      /* 28 */ [[ -1.15, -3.30,  0.00], 0.70],  // left upper thigh
      /* 29 */ [[  1.15, -3.30,  0.00], 0.70],  // right upper thigh
      /* 30 */ [[ -1.05, -4.85,  0.00], 0.80],  // left knee
      /* 31 */ [[  1.05, -4.85,  0.00], 0.80],  // right knee
      /* 32 */ [[ -0.95, -6.30,  0.00], 0.65],  // left mid shin
      /* 33 */ [[  0.95, -6.30,  0.00], 0.65],  // right mid shin
      /* 34 */ [[ -0.85, -7.40,  0.00], 0.75],  // left ankle
      /* 35 */ [[  0.85, -7.40,  0.00], 0.75],  // right ankle
    ];

    /* ════════════════════════════════════════
       EDGE MAP  [ nodeA, nodeB ]
    ════════════════════════════════════════ */
    const EDGES = [
      // Head
      [0, 1], [0, 2], [0, 3],
      [1, 4], [2, 5],
      [3, 4], [3, 5],
      [4, 6], [5, 6],

      // Head → spine
      [6, 7],

      // Spine chain
      [7, 8], [8, 9], [9, 10], [10, 11],

      // Shoulder girdle
      [7, 12], [7, 13],
      [8, 12], [8, 13],
      [12, 13],

      // Arms
      [12, 14], [14, 16], [16, 18],
      [13, 15], [15, 17], [17, 19],

      // Chest / torso web
      [12, 20], [13, 21],
      [20, 21],
      [20, 22], [21, 22],
      [8, 22],
      [22, 23], [22, 24],
      [9, 23],  [9, 24],
      [23, 24],
      [23, 25], [24, 25],
      [10, 25],

      // Pelvis
      [11, 26], [11, 27],
      [10, 26], [10, 27],
      [26, 27],

      // Legs
      [26, 28], [27, 29],
      [28, 30], [29, 31],
      [30, 32], [31, 33],
      [32, 34], [33, 35],
    ];

    /* ── Pulse pathway: a curated chain of nodes to travel ── */
    const PULSE_PATHS = [
      [0, 7, 8, 22, 10, 11, 26, 28, 30, 32, 34],   // crown → left foot
      [0, 7, 8, 22, 10, 11, 27, 29, 31, 33, 35],   // crown → right foot
      [12, 14, 16, 18],                              // left arm
      [13, 15, 17, 19],                              // right arm
      [3, 6, 7, 8, 9, 25],                           // face → navel
      [20, 22, 23, 25, 26, 28, 30],                  // left torso-leg
      [21, 22, 24, 25, 27, 29, 31],                  // right torso-leg
    ];

    /* ════════════════════════
       BUILD SCENE OBJECTS
    ════════════════════════ */
    const figure = new THREE.Group();
    figure.position.y = 0.5; // slight upward nudge to visual centre
    scene.add(figure);

    /* Nodes: glow sprite + hard core */
    const nodeObjs = NODES.map(([[x, y, z], r], i) => {
      const pos = new THREE.Vector3(x, y, z);

      const spMat = new THREE.SpriteMaterial({
        map: GLOW_TEX,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.68,
      });
      const sprite = new THREE.Sprite(spMat);
      sprite.position.copy(pos);
      sprite.scale.setScalar(r * 2.2);
      figure.add(sprite);

      const coreGeo = new THREE.SphereGeometry(r * 0.09, 10, 8);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xF5E0A0, transparent: true, opacity: 0.95 });
      const core = new THREE.Mesh(coreGeo, coreMat);
      core.position.copy(pos);
      figure.add(core);

      return { sprite, core, baseR: r, phase: Math.random() * Math.PI * 2 };
    });

    /* Edges */
    EDGES.forEach(([a, b]) => {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(...NODES[a][0]),
        new THREE.Vector3(...NODES[b][0]),
      ]);
      const mat = new THREE.LineBasicMaterial({
        color: 0xC9A45C,
        transparent: true,
        opacity: 0.18,
      });
      figure.add(new THREE.Line(geo, mat));
    });

    /* Traveling signal pulses */
    const pulses = PULSE_PATHS.map((path, i) => {
      const spMat = new THREE.SpriteMaterial({
        map: GLOW_TEX,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.95,
      });
      const sprite = new THREE.Sprite(spMat);
      sprite.scale.setScalar(0.55);
      figure.add(sprite);
      return {
        sprite,
        path,
        phase: (i / PULSE_PATHS.length) * Math.PI * 2,
        speed: 0.18 + i * 0.022,
      };
    });

    /* Deep background: very faint star-like particles */
    const STARDUST = 280;
    const starBuf = new Float32Array(STARDUST * 3);
    for (let i = 0; i < STARDUST; i++) {
      starBuf[i*3]   = (Math.random() - 0.5) * 50;
      starBuf[i*3+1] = (Math.random() - 0.5) * 30;
      starBuf[i*3+2] = -8 - Math.random() * 15;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starBuf, 3));
    scene.add(new THREE.Points(starGeo,
      new THREE.PointsMaterial({ color: 0xB58A3A, size: 0.04, transparent: true, opacity: 0.10 })));

    /* ════════════════════════
       ANIMATION LOOP
    ════════════════════════ */
    let t = 0;
    (function loop() {
      requestAnimationFrame(loop);
      t += 0.006;

      /* Very slow figure rotation */
      figure.rotation.y = t * 0.22;

      /* Node glow breathe */
      nodeObjs.forEach(n => {
        const breathe = 0.82 + 0.18 * Math.sin(t * 1.1 + n.phase);
        n.sprite.scale.setScalar(n.baseR * 2.2 * breathe);
        n.sprite.material.opacity = 0.52 + 0.16 * Math.sin(t * 0.85 + n.phase);
      });

      /* Signal pulses travel along paths */
      pulses.forEach(p => {
        const progress = (Math.sin(t * p.speed + p.phase) + 1) / 2; // 0→1→0
        const seg     = p.path.length - 1;
        const raw     = progress * seg;
        const segIdx  = Math.min(Math.floor(raw), seg - 1);
        const frac    = raw - segIdx;
        const na = NODES[p.path[segIdx]][0];
        const nb = NODES[p.path[segIdx + 1]][0];
        p.sprite.position.set(
          na[0] + (nb[0] - na[0]) * frac,
          na[1] + (nb[1] - na[1]) * frac + 0.5,
          na[2] + (nb[2] - na[2]) * frac,
        );
      });

      /* Gentle camera drift */
      camera.position.y = 0.5 + Math.sin(t * 0.09) * 0.9;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    })();

    /* Resize */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* Form */
    document.getElementById('accessForm').addEventListener('submit', function(e) {
      e.preventDefault();
      this.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  </script>

</body>
</html>
