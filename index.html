<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMAN FORME — Private Longevity Clinic</title>
  <meta name="description" content="Advanced diagnostics, preventative medicine, and precision optimization — engineered to build the highest form of yourself.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #050505;
      --brass:      #B58A3A;
      --brass-soft: #C9A45C;
      --muted:      #9A9A9A;
      --off-white:  #F5F2EA;
    }

    html, body { height: 100%; }

    body {
      background-color: var(--bg);
      font-family: 'Raleway', sans-serif;
      overflow-x: hidden;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .content {
      width: 100%;
      max-width: 700px;
      opacity: 0;
      animation: fadeUp 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }

    /* ── Wordmark ── */
    .wordmark {
      font-weight: 300;
      font-size: clamp(28px, 7.5vw, 68px);
      letter-spacing: 0.3em;
      word-spacing: 0.48em;
      color: var(--brass-soft);
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 30px;
    }

    /* Three-bar E — all bars full width, equal spacing */
    .e-glyph {
      display: inline-block;
      width: 0.46em;
      height: 0.71em;
      position: relative;
      vertical-align: baseline;
    }

    .e-glyph > span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 1.5px;
      background-color: var(--brass-soft);
    }

    .e-glyph > span:nth-child(1) { top: 0; }
    .e-glyph > span:nth-child(2) { top: 50%; transform: translateY(-50%); }
    .e-glyph > span:nth-child(3) { bottom: 0; }

    /* ── Dividers ── */
    .divider {
      width: 36px;
      height: 1px;
      background-color: var(--brass);
      margin: 0 auto 22px;
    }

    /* ── Tagline ── */
    .tagline {
      font-weight: 300;
      font-size: clamp(10px, 1.6vw, 12px);
      letter-spacing: 0.52em;
      color: var(--brass-soft);
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    /* ── Phrase ── */
    .phrase {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(16px, 2.6vw, 21px);
      line-height: 1.95;
      color: var(--muted);
      max-width: 520px;
      margin: 8px auto 64px;
    }

    /* ── Form ── */
    .form-section { margin-bottom: 60px; }

    .form-label {
      display: block;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.48em;
      color: var(--brass);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 340px;
      margin: 0 auto 28px;
    }

    .form-fields input {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      border-bottom: 1px solid #242424;
      padding: 12px 0;
      width: 100%;
      color: var(--off-white);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-align: center;
      outline: none;
      border-radius: 0;
      transition: border-color 0.3s;
    }

    .form-fields input::placeholder { color: #333; letter-spacing: 0.14em; }
    .form-fields input:focus { border-bottom-color: var(--brass); }

    .form-btn {
      appearance: none;
      -webkit-appearance: none;
      display: inline-block;
      padding: 14px 48px;
      background: transparent;
      border: 1px solid var(--brass);
      color: var(--brass-soft);
      font-family: 'Raleway', sans-serif;
      font-weight: 400;
      font-size: 10px;
      letter-spacing: 0.44em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 0;
      transition: background-color 0.28s, color 0.28s;
    }

    .form-btn:hover  { background-color: var(--brass); color: var(--bg); }
    .form-btn:active { opacity: 0.85; }

    .success-msg {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 17px;
      letter-spacing: 0.08em;
      color: var(--brass-soft);
      padding: 12px 0 4px;
    }

    /* ── Footer ── */
    .footer-tick {
      width: 1px;
      height: 24px;
      background-color: #1d1d1d;
      margin: 0 auto 18px;
    }

    .coming-soon {
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.38em;
      color: #363636;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .page    { padding: 60px 24px; }
      .tagline { letter-spacing: 0.36em; }
      .form-btn { padding: 13px 36px; letter-spacing: 0.36em; }
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>

  <div class="page">
    <div class="content">

      <h1 class="wordmark">HUMAN&nbsp;FORM<span class="e-glyph" aria-label="E"><span></span><span></span><span></span></span></h1>

      <div class="divider"></div>
      <p class="tagline">Forme Your Future</p>
      <div class="divider"></div>

      <p class="phrase">Advanced diagnostics, preventative medicine, and precision&nbsp;optimization&nbsp;&mdash; engineered to build the highest form of&nbsp;yourself.</p>

      <div class="form-section">
        <span class="form-label">Request Early Access</span>
        <form class="form-fields" id="accessForm" novalidate>
          <input type="text"  name="name"  placeholder="Name"  autocomplete="name">
          <input type="email" name="email" placeholder="Email" autocomplete="email">
          <input type="tel"   name="phone" placeholder="Phone" autocomplete="tel">
          <button type="submit" class="form-btn">Notify Me</button>
        </form>
        <p class="success-msg" id="successMsg">Thank you. We will be in touch.</p>
      </div>

      <div class="footer-tick"></div>
      <p class="coming-soon">Private Longevity Clinic&nbsp;&mdash;&nbsp;Coming Soon</p>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    /* ═══════════════════════════════════════════════
       VOXEL HUMAN — Satin Brass Pixel Figure
    ═══════════════════════════════════════════════ */

    const canvas   = document.getElementById('bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2, 1, 20);
    camera.lookAt(0, 0, 0);

    /* ── Lighting for satin-brass shading ── */
    scene.add(new THREE.AmbientLight(0xffffff, 0.42));

    const key = new THREE.DirectionalLight(0xD4AA60, 1.3);
    key.position.set(6, 10, 7);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x7A5A28, 0.4);
    fill.position.set(-5, 2, 3);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xC9A45C, 0.3);
    rim.position.set(0, -6, -5);
    scene.add(rim);

    /* ══════════════════════════════════════
       VOXEL BODY DEFINITION
       Grid spacing S — each integer step = one voxel slot
       Voxel cube size VS < S so gaps are visible
    ══════════════════════════════════════ */
    const S  = 0.65;   // spacing between voxel centres
    const VS = 0.50;   // physical size of each cube

    /*
      Coordinate system: Y up, X right, Z toward viewer
      Body is centred at origin (y spans ~−7 to +7)

      Parts: [ [x1,x2], [y1,y2], [z1,z2] ] — inclusive integer ranges
    */
    const PARTS = [
      // ── Head ──────────────────────────────────
      [[-1, 1], [ 8, 11], [0, 1]],

      // ── Neck ──────────────────────────────────
      [[-1, 0], [ 6,  7], [0, 0]],

      // ── Shoulders (connects torso to arms) ────
      [[-4, 3], [ 5,  6], [0, 1]],

      // ── Torso ─────────────────────────────────
      [[-2, 1], [ 0,  4], [0, 1]],

      // ── Left upper arm ────────────────────────
      [[-5,-4], [ 1,  5], [0, 0]],
      // ── Right upper arm ───────────────────────
      [[ 2, 3], [ 1,  5], [0, 0]],

      // ── Left forearm (angles outward) ─────────
      [[-6,-4], [-3,  0], [0, 0]],
      // ── Right forearm ─────────────────────────
      [[ 2, 4], [-3,  0], [0, 0]],

      // ── Hips ──────────────────────────────────
      [[-2, 1], [-2, -1], [0, 1]],

      // ── Left upper leg ────────────────────────
      [[-2,-1], [-6, -3], [0, 1]],
      // ── Right upper leg ───────────────────────
      [[ 0, 1], [-6, -3], [0, 1]],

      // ── Left lower leg ────────────────────────
      [[-2,-1], [-10,-7], [0, 0]],
      // ── Right lower leg ───────────────────────
      [[ 0, 1], [-10,-7], [0, 0]],

      // ── Left foot ─────────────────────────────
      [[-3,-1], [-11,-11],[0, 1]],
      // ── Right foot ────────────────────────────
      [[ 0, 2], [-11,-11],[0, 1]],
    ];

    // Expand grid coordinates → world positions (deduplicated)
    const seen   = new Set();
    const coords = [];

    for (const [[x1,x2],[y1,y2],[z1,z2]] of PARTS) {
      for (let x = x1; x <= x2; x++)
      for (let y = y1; y <= y2; y++)
      for (let z = z1; z <= z2; z++) {
        const key = `${x},${y},${z}`;
        if (!seen.has(key)) {
          seen.add(key);
          coords.push(x * S, y * S, z * S);
        }
      }
    }

    const N = coords.length / 3;

    /* ── Instanced voxel mesh ── */
    const voxelGeo = new THREE.BoxGeometry(VS, VS, VS);
    const voxelMat = new THREE.MeshPhongMaterial({
      color:     0xB58A3A,
      emissive:  0x1E1208,
      specular:  0x5A3C18,
      shininess: 38,
      transparent: true,
      opacity:   0.84,
    });

    const mesh  = new THREE.InstancedMesh(voxelGeo, voxelMat, N);
    const dummy = new THREE.Object3D();

    for (let i = 0; i < N; i++) {
      dummy.position.set(coords[i*3], coords[i*3+1], coords[i*3+2]);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;

    const figure = new THREE.Group();
    figure.add(mesh);
    scene.add(figure);

    /* ── Ambient dust particles ── */
    const DUST = 500;
    const dBuf = new Float32Array(DUST * 3);
    for (let i = 0; i < DUST; i++) {
      dBuf[i*3]   = (Math.random() - 0.5) * 28;
      dBuf[i*3+1] = (Math.random() - 0.5) * 22;
      dBuf[i*3+2] = (Math.random() - 0.5) * 18;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dBuf, 3));
    scene.add(new THREE.Points(dustGeo,
      new THREE.PointsMaterial({ color: 0xB58A3A, size: 0.05, transparent: true, opacity: 0.20 })));

    /* ── Render loop ── */
    let t = 0;
    (function loop() {
      requestAnimationFrame(loop);
      t += 0.003;
      figure.rotation.y = t;
      // very slow camera float
      camera.position.y = 1 + Math.sin(t * 0.13) * 0.9;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    })();

    /* ── Resize ── */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ── Form ── */
    document.getElementById('accessForm').addEventListener('submit', function(e) {
      e.preventDefault();
      this.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  </script>

</body>
</html>
